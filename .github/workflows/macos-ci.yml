name: macOS Compatibility CI

on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-helper:
    name: Build Windows CLI Window Helper from Source
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Compile and verify the Windows helper
        shell: pwsh
        run: |
          node -e '
            const fs = require("node:fs");
            const { ensureWindowsHelper } = require("./scripts/package-release.js");
            const built = ensureWindowsHelper();
            try {
              fs.copyFileSync(built.helperPath, "scripts/cli-window-helper.exe");
              fs.writeFileSync("scripts/cli-window-helper.exe.sha256", built.helperSha256 + "  scripts/cli-window-helper.exe\n");
            } finally {
              fs.rmSync(built.tempDir, { recursive: true, force: true });
            }
          '
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Compiled Helper Artifact
        uses: actions/upload-artifact@v6
        with:
          name: cli-window-helper-win
          if-no-files-found: error
          path: |
            scripts/cli-window-helper.exe
            scripts/cli-window-helper.exe.sha256

  verify-macos:
    name: Verify macOS (${{ matrix.label }})
    needs: build-windows-helper
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon (arm64 / macos-15)
            runner: macos-15
          - label: Intel (x86_64 / macos-15-intel)
            runner: macos-15-intel

    steps:
      - name: Inspect Runner Hardware & OS
        shell: bash
        run: |
          UNAME_INFO="$(uname -a)"
          SW_INFO="$(sw_vers | tr '\n' ';')"
          ARCH_INFO="$(arch)"
          CPU_INFO="$(sysctl -n machdep.cpu.brand_string || echo unknown)"
          echo "$UNAME_INFO"
          echo "$SW_INFO"
          echo "arch=$ARCH_INFO cpu=$CPU_INFO"
          echo "::notice title=Runner Hardware (${{ matrix.runner }})::uname=$UNAME_INFO | arch=$ARCH_INFO | cpu=$CPU_INFO | $SW_INFO"

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Full JS Test Suite & Renderer Build
        shell: bash
        run: |
          npm test > /tmp/npm-test.log 2>&1 || {
            ERR_OUT="$(node -e 'const fs=require("fs");const lines=fs.readFileSync("/tmp/npm-test.log","utf8").split(/\r?\n/);const fails=lines.map((l,i)=>/^(not ok |✖ )/.test(l)?lines.slice(i,i+12).join("\n"):"").filter(Boolean);const out=(fails.length?fails.join("\n---\n"):lines.slice(-60).join("\n")).slice(0,3200);process.stdout.write(out.replace(/%/g,"%25").replace(/\r/g,"").replace(/\n/g,"%0A"));')"
            echo "::error title=npm test failed on ${{ matrix.runner }}::$ERR_OUT"
            cat /tmp/npm-test.log
            exit 1
          }
          SUMMARY_OUT="$(grep -E '^ℹ |^# (tests|suites|pass|fail|skipped|duration_ms) ' /tmp/npm-test.log | tr '\n' ' ' || true)"
          echo "::notice title=npm test passed (${{ matrix.runner }})::$SUMMARY_OUT"
          cat /tmp/npm-test.log

      - name: Run Python Attachment Scanner Tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest attachment_scan_test.py 2>&1 | tee /tmp/py-test.log
          echo "::notice title=Python test passed (${{ matrix.runner }})::$(tail -n 3 /tmp/py-test.log | tr '\n' ' ')"

      - name: Run macOS Real Mach-O Codesign & Execution Verification (Isolated /tmp)
        shell: bash
        run: |
          node scripts/macos-ci-verify.js > /tmp/macos-real.log 2>&1 || {
            FAIL_OUT="$(cat /tmp/macos-real.log | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))')"
            echo "::error title=macos-ci-verify failed (${{ matrix.runner }})::$FAIL_OUT"
            cat /tmp/macos-real.log
            exit 1
          }
          PASS_OUT="$(cat /tmp/macos-real.log | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))')"
          echo "::notice title=Real Mach-O Verify (${{ matrix.runner }})::$PASS_OUT"
          cat /tmp/macos-real.log

      - name: Download CI-Built Windows Helper
        uses: actions/download-artifact@v7
        with:
          name: cli-window-helper-win
          path: scripts

      - name: Verify Package Manifest & Cross-Platform Build
        shell: bash
        run: |
          node scripts/check-release-manifest.js
          npm run pack
          unzip -l dist/release/antigravity-context-viewer_*_darwin_arm64.zip | grep macos-binary-utils.js
          unzip -l dist/release/antigravity-context-viewer_*_darwin_amd64.zip | grep macos-binary-utils.js
          CHECKSUMS="$(cat dist/release/checksums.txt | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))')"
          echo "::notice title=Release Checksums (${{ matrix.runner }})::$CHECKSUMS"
