name: Sync Release Notes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Update Historical Releases Body
        run: |
          gh release edit v2.7.2 --notes "修复Token看板数据锁死，支持K/M/B自适应与动态热同步"
          gh release edit v2.7.3 --notes "UI优化适配 anti gravity 新版本"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
